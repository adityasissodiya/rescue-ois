worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"http_user_agent":"$http_user_agent",'
        '"ssl_client_s_dn":"$ssl_client_s_dn"'
    '}';
    access_log /var/log/nginx/access.log json;

    upstream ops_api {
        server ops-api:8000;
    }
    upstream syncd_app {
        server syncd:8000;
    }
    upstream martin {
        server martin:3000;
    }

    server {
        listen 443 ssl;
        server_name _;

        # TLS placeholder — replace with K430-issued cert from organizational CA in production.
        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # mTLS — clients (tablets, peer K430s) must present a cert signed by the
        # organizational authority CA. Uncomment and provide the chain in production.
        # ssl_client_certificate /etc/nginx/tls/authority-ca.crt;
        # ssl_verify_client      on;
        # ssl_verify_depth       3;

        location /api/ {
            proxy_pass http://ops_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;
        }

        # /sync/* endpoints are only valid on command-role K430s.
        # Responder K430s should leave this location returning 404 (the upstream
        # service responds 501 in responder mode anyway).
        location /sync/ {
            proxy_pass http://syncd_app/sync/;
            proxy_set_header Host $host;
        }

        location /tiles/ {
            proxy_pass http://martin/;
            proxy_set_header Host $host;
        }

        location /files/ {
            alias /data/files/;
            autoindex off;
        }

        location /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
