<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1117; font-family: 'IBM Plex Sans', sans-serif; padding: 16px; }
  .label { font-size: 9px; font-weight: 600; color: #4a5168; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; margin-top: 12px; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px; margin-bottom: 5px; }
  .icon { width: 18px; height: 18px; flex-shrink: 0; }
  .bar-text { font-size: 13px; flex: 1; }
  .bar-mono { font-size: 11px; font-family: 'JetBrains Mono', monospace; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
</style>
</head><body>

<div class="label">Sync status bars</div>

<div class="bar" style="background:rgba(45,182,125,0.1);border:1px solid rgba(45,182,125,0.25)">
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#2db67d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span class="bar-text" style="color:#f0f2f7">Sync complete</span>
  <span class="bar-mono" style="color:#2db67d">seq=00247</span>
</div>

<div class="bar" style="background:rgba(245,178,30,0.1);border:1px solid rgba(245,178,30,0.25)">
  <svg class="icon pulse" viewBox="0 0 24 24" fill="none" stroke="#f5b21e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>
  <span class="bar-text" style="color:#f0f2f7">Syncing outbox</span>
  <span class="bar-mono" style="color:#f5b21e">3 edits pending</span>
</div>

<div class="bar" style="background:rgba(232,48,42,0.1);border:1px solid rgba(232,48,42,0.25)">
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#e8302a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.56 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
  <span class="bar-text" style="color:#f0f2f7">WAN partition detected</span>
  <span class="bar-mono" style="color:#e8302a">mesh only</span>
</div>

<div class="bar" style="background:rgba(0,87,168,0.12);border:1px solid rgba(0,87,168,0.3)">
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#6aaef0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
  <span class="bar-text" style="color:#f0f2f7">Promoted to command</span>
  <span class="bar-mono" style="color:#6aaef0">cmd-03 active</span>
</div>

<div class="label">Inline field inputs</div>
<div style="display:flex;flex-direction:column;gap:6px">
  <div style="display:flex;gap:8px;align-items:center">
    <label style="font-size:11px;font-weight:500;color:#8a94b0;width:90px;text-transform:uppercase;letter-spacing:.05em">Node ID</label>
    <input style="background:#1c2030;border:1px solid #2e3650;border-radius:5px;color:#f0f2f7;font-family:'JetBrains Mono',monospace;font-size:12px;padding:6px 10px;flex:1;outline:none" value="cmd-01" readonly>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <label style="font-size:11px;font-weight:500;color:#8a94b0;width:90px;text-transform:uppercase;letter-spacing:.05em">Role</label>
    <select style="background:#1c2030;border:1px solid #2e3650;border-radius:5px;color:#f0f2f7;font-family:'IBM Plex Sans',sans-serif;font-size:12px;padding:6px 10px;flex:1;outline:none">
      <option>Command</option><option>Responder</option>
    </select>
  </div>
</div>
</body></html>
