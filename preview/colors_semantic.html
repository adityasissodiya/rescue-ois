<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1117; font-family: 'IBM Plex Sans', sans-serif; padding: 16px; }
  .row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
  .swatch { height: 36px; border-radius: 5px; position: relative; }
  .group-label { font-size: 10px; font-weight: 600; color: #4a5168; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 5px; margin-top: 10px; }
  .label { font-size: 11px; color: #4a5168; font-family: 'JetBrains Mono', monospace; width: 120px; flex-shrink: 0; }
  .swatch-label { font-size: 9px; font-family: 'JetBrains Mono', monospace; color: rgba(255,255,255,0.5); padding: 2px 6px; }
</style>
</head><body>
<div class="group-label">Backgrounds</div>
<div class="row">
  <div class="label">--bg-base</div>
  <div class="swatch" style="background:#0f1117; width:200px; border:1px solid #2e3650"><span class="swatch-label">#0f1117</span></div>
  <div class="swatch" style="background:#1c2030; width:60px; border:1px solid #2e3650"><span class="swatch-label">#1c2030</span></div>
  <div class="swatch" style="background:#252b3b; width:60px; border:1px solid #2e3650"><span class="swatch-label">#252b3b</span></div>
  <div class="swatch" style="background:#2e3650; width:60px"><span class="swatch-label">#2e3650</span></div>
</div>

<div class="group-label">Text</div>
<div class="row">
  <div class="label">--text-primary</div>
  <div style="font-size:14px; font-weight:500; color:#f0f2f7">Primary text — incident status</div>
</div>
<div class="row">
  <div class="label">--text-secondary</div>
  <div style="font-size:14px; color:#8a94b0">Secondary — vehicle ID, timestamps</div>
</div>
<div class="row">
  <div class="label">--text-muted</div>
  <div style="font-size:14px; color:#4a5168">Muted — disabled, placeholders</div>
</div>

<div class="group-label">Semantic</div>
<div class="row" style="gap:8px; flex-wrap:wrap">
  <div style="background:#f5681e; color:#fff; font-size:12px; font-weight:600; padding:4px 10px; border-radius:4px">Primary</div>
  <div style="background:#e8302a; color:#fff; font-size:12px; font-weight:600; padding:4px 10px; border-radius:4px">Danger</div>
  <div style="background:#0057a8; color:#fff; font-size:12px; font-weight:600; padding:4px 10px; border-radius:4px">Info</div>
  <div style="background:#2db67d; color:#fff; font-size:12px; font-weight:600; padding:4px 10px; border-radius:4px">Success</div>
  <div style="background:#f5b21e; color:#0f1117; font-size:12px; font-weight:600; padding:4px 10px; border-radius:4px">Warning</div>
</div>

<div class="group-label">Paper palette</div>
<div class="row" style="gap:6px">
  <div class="swatch" style="background:#ffffff; width:50px; border:1px solid #ddd"><span style="font-size:9px;color:#aaa;padding:2px 4px">bg</span></div>
  <div class="swatch" style="background:#1a1a1a; width:50px"><span style="font-size:9px;color:#aaa;padding:2px 4px">text</span></div>
  <div class="swatch" style="background:#4a4a4a; width:50px"><span style="font-size:9px;color:#aaa;padding:2px 4px">sec</span></div>
  <div class="swatch" style="background:#888888; width:50px"><span style="font-size:9px;color:#fff;padding:2px 4px">muted</span></div>
  <div class="swatch" style="background:#cccccc; width:50px"><span style="font-size:9px;color:#555;padding:2px 4px">rule</span></div>
</div>
</body></html>
