[project]
name = "crdt-lww-baseline"
version = "0.1.0"
description = "Hanssen-style operation-based CRDT LWW baseline for Rescue OIS evaluation"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
