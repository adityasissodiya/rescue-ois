<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiered Sync — Field Tablet UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0a0c12; font-family: 'IBM Plex Sans', sans-serif; }
  @keyframes tbPulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Outer frame — simulates tablet viewport */
  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background: #0a0c12;
  }
  .device {
    width: 900px;
    height: 620px;
    background: #0f1117;
    border-radius: 14px;
    border: 1px solid #252b3b;
    box-shadow: 0 8px 48px rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* Tweak panel */
  .tweak-panel {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #1c2030;
    border: 1px solid #2e3650;
    border-radius: 10px;
    padding: 14px 16px;
    width: 220px;
    font-family: 'IBM Plex Sans', sans-serif;
    z-index: 200;
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    display: none;
  }
  .tweak-panel.visible { display: block; }
  .tweak-title { font-size: 11px; font-weight: 600; color: #4a5168; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
  .tweak-row { margin-bottom: 10px; }
  .tweak-label { font-size: 11px; color: #8a94b0; margin-bottom: 4px; }
  .tweak-select, .tweak-toggle { width: 100%; background: #252b3b; border: 1px solid #2e3650; border-radius: 5px; color: #f0f2f7; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; padding: 5px 8px; cursor: pointer; }
</style>
</head>
<body>
<div class="stage">
  <div class="device" id="app-root"></div>
</div>
<div class="tweak-panel" id="tweak-panel">
  <div class="tweak-title">Tweaks</div>
  <div class="tweak-row">
    <div class="tweak-label">Node role</div>
    <select class="tweak-select" id="tw-role">
      <option value="COMMAND">COMMAND</option>
      <option value="RESPONDER">RESPONDER</option>
      <option value="TABLET">TABLET</option>
    </select>
  </div>
  <div class="tweak-row">
    <div class="tweak-label">Sync status</div>
    <select class="tweak-select" id="tw-sync">
      <option value="LIVE">LIVE</option>
      <option value="SYNCING">SYNCING</option>
      <option value="OFFLINE">OFFLINE</option>
    </select>
  </div>
  <div class="tweak-row">
    <div class="tweak-label">Initial screen</div>
    <select class="tweak-select" id="tw-screen">
      <option value="incident">Incident</option>
      <option value="fleet">Fleet</option>
      <option value="siteplan">Site Plan</option>
      <option value="outbox">Outbox</option>
    </select>
  </div>
</div>

<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="IncidentView.jsx"></script>
<script type="text/babel" src="FleetView.jsx"></script>
<script type="text/babel" src="SitePlanView.jsx"></script>
<script type="text/babel" src="OutboxView.jsx"></script>
<script type="text/babel" src="PromoteModal.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "role": "COMMAND",
  "syncStatus": "LIVE",
  "initialScreen": "incident"
}/*EDITMODE-END*/;

function App() {
  const saved = React.useMemo(() => {
    try { return JSON.parse(localStorage.getItem('ts-kit-screen')); } catch { return null; }
  }, []);

  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [screen, setScreenRaw] = React.useState(saved || TWEAK_DEFAULTS.initialScreen);
  const [showPromote, setShowPromote] = React.useState(false);
  const [promoteTarget, setPromoteTarget] = React.useState('RSP-03');

  function setScreen(s) {
    setScreenRaw(s);
    localStorage.setItem('ts-kit-screen', JSON.stringify(s));
  }

  // Listen for tweak panel changes
  React.useEffect(() => {
    function handleMsg(e) {
      if (e.data?.type === '__activate_edit_mode') {
        document.getElementById('tweak-panel').classList.add('visible');
      } else if (e.data?.type === '__deactivate_edit_mode') {
        document.getElementById('tweak-panel').classList.remove('visible');
      }
    }
    window.addEventListener('message', handleMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');

    // Wire up tweak controls
    function wire(id, key) {
      const el = document.getElementById(id);
      if (!el) return;
      el.value = tweaks[key] || TWEAK_DEFAULTS[key];
      el.addEventListener('change', () => {
        const update = { [key]: el.value };
        setTweaks(t => ({ ...t, ...update }));
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: update }, '*');
      });
    }
    wire('tw-role', 'role');
    wire('tw-sync', 'syncStatus');
    wire('tw-screen', 'initialScreen');

    return () => window.removeEventListener('message', handleMsg);
  }, []);

  function openPromote(nodeId) {
    setPromoteTarget(nodeId || 'RSP-03');
    setShowPromote(true);
  }

  return (
    <>
      <TopBar
        nodeId={tweaks.role === 'COMMAND' ? 'CMD-01' : tweaks.role === 'RESPONDER' ? 'RSP-03' : 'TAB-A'}
        role={tweaks.role}
        syncStatus={tweaks.syncStatus}
        screen={screen}
        setScreen={setScreen}
      />
      {screen === 'incident'  && <IncidentView onOpenOutbox={() => setScreen('outbox')} />}
      {screen === 'fleet'     && <FleetView onPromote={() => openPromote('RSP-03')} />}
      {screen === 'siteplan'  && <SitePlanView />}
      {screen === 'outbox'    && <OutboxView connected={tweaks.syncStatus === 'LIVE'} />}
      {showPromote && <PromoteModal targetNode={promoteTarget} onClose={() => setShowPromote(false)} />}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('app-root'));
root.render(<App />);
</script>
</body>
</html>
