worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"http_user_agent":"$http_user_agent",'
        '"ssl_client_s_dn":"$ssl_client_s_dn"'
    '}';
    access_log /var/log/nginx/access.log json;

    upstream sync_api {
        server sync-api:8000;
    }
    upstream audit_api {
        server audit-api:8000;
    }
    upstream martin {
        server martin:3000;
    }
    upstream geoserver {
        server geoserver:8080;
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        # TLS placeholder — replace with organizational CA-issued certs in production
        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /sync/ {
            proxy_pass http://sync_api/sync/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /audit/ {
            proxy_pass http://audit_api/audit/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /tiles/ {
            proxy_pass http://martin/;
            proxy_set_header Host $host;
        }

        location /packages/ {
            alias /data/packages/;
            autoindex off;
            add_header Cache-Control "public, max-age=3600";
        }

        location /geoserver/ {
            proxy_pass http://geoserver/geoserver/;
            proxy_set_header Host $host;
        }

        location /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
