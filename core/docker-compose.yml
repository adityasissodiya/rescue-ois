version: "3.9"

networks:
  default:
    name: rescue-ois-net
    external: true

volumes:
  postgres-data:
  packages-data:

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rescue_ois}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - postgres.core
    ports:
      - "5432:5432"

  martin:
    image: ghcr.io/maplibre/martin:latest
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres.core:5432/${POSTGRES_DB:-rescue_ois}
    depends_on: [postgres]
    ports:
      - "3000:3000"

  geoserver:
    image: kartoza/geoserver:2.28.0
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
    ports:
      - "8080:8080"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - packages-data:/data/packages:ro
    depends_on: [martin, geoserver, sync-api, audit-api]
    ports:
      - "443"
      - "80"

  feed-importer:
    build: ./feed-importer
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres.core:5432/${POSTGRES_DB:-rescue_ois}
      LM_API_KEY: ${LM_API_KEY:-}
      SMHI_API_KEY: ${SMHI_API_KEY:-}
      TRV_API_KEY: ${TRV_API_KEY:-}
    depends_on: [postgres]

  publisher:
    build: ./publisher
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres.core:5432/${POSTGRES_DB:-rescue_ois}
      PUBLISH_DIR: /data/packages
    volumes:
      - packages-data:/data/packages
    depends_on: [postgres]

  sync-api:
    build: ./sync-api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres.core:5432/${POSTGRES_DB:-rescue_ois}
      PACKAGES_DIR: /data/packages
    volumes:
      - packages-data:/data/packages:ro
    depends_on: [postgres]
    networks:
      default:
        aliases:
          - sync-api.core
    ports:
      - "${SYNC_API_PORT:-18000}:8000"

  audit-api:
    build: ./audit-api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres.core:5432/${POSTGRES_DB:-rescue_ois}
    depends_on: [postgres]
