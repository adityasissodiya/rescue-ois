protocol_steps:
  responder_outbox:
    sources:
      - "paper/sections/04_synchronization_protocol.tex:14-41"
      - "edge/ops-api/src/routes/api.py:34-61"
      - "edge/syncd/src/outbox.py:11-49"
      - "edge/syncd/src/push.py:1-90"
      - "edge/syncd/src/accept.py:49-129"
    steps:
      - id: 1
        actor: "tablet or Python stub"
        action: "submits field edit to responder ops-api"
        endpoint: "POST /api/events"
        durable_boundary: false
      - id: 2
        actor: "responder ops-api"
        action: "inserts outbox.device_outbox row"
        idempotency: "ON CONFLICT (client_event_id) DO NOTHING"
        durable_boundary: true
      - id: 3
        actor: "responder syncd.push"
        action: "fetches rows where forwarded_at is NULL"
        config:
          poll_interval_s: 0.25
          batch_size: 50
      - id: 4
        actor: "responder syncd.push"
        action: "posts batch to command accept endpoint"
        endpoint: "POST /accept/event-batch"
      - id: 5
        actor: "command syncd.accept"
        action: "rejects non-command role; groups by incident; locks incident.state FOR UPDATE"
      - id: 6
        actor: "command syncd.accept"
        action: "checks client_event_id for duplicate"
        idempotency: "journal_client_event_id unique index"
      - id: 7
        actor: "command syncd.accept"
        action: "increments event_seq and appends incident.journal row"
        durable_boundary: true
      - id: 8
        actor: "command syncd.accept"
        action: "updates incident.state last_event_seq"
        state_status: "derived/materialized"
      - id: 9
        actor: "command syncd.accept"
        action: "returns accepted, duplicates, and last_acked_seq"
      - id: 10
        actor: "responder syncd.push"
        action: "marks forwarded_at and ack_seq on local outbox rows"
        durable_boundary: true
  command_to_core:
    sources:
      - "edge/syncd/src/forward.py:1-111"
      - "core/sync-api/src/routes/sync.py:78-126"
      - "core/db/migrations/005_idempotency.sql:78-88"
    steps:
      - id: 1
        actor: "command syncd.forward"
        action: "reads last_acked_seq_to_core from sync.state"
      - id: 2
        actor: "command syncd.forward"
        action: "selects incident.journal rows with event_seq greater than cursor"
        config:
          poll_interval_s: 1.0
          batch_size: 200
      - id: 3
        actor: "command syncd.forward"
        action: "posts /sync/journal-batch to core sync-api"
      - id: 4
        actor: "core sync-api"
        action: "inserts master.incident_events idempotently by client_event_id"
      - id: 5
        actor: "command syncd.forward"
        action: "advances last_acked_seq_to_core cursor after success"

promotion:
  status: "model and interactive script; no durable epoch/fencing implementation in evaluated services"
  sources:
    - "paper/sections/04_synchronization_protocol.tex:52-57"
    - "paper/sections/05_implementation.tex:25"
    - "formal/tla/RescueOIS.tla:114-140"
    - "formal/tla/README.md:54-57"
    - "scripts/promote-responder.sh:1-43"
    - "docs/runbooks/command-failover.md:1-30"
    - "docs/adr/0004-promotion-authority-model.md:1-40"
  strict_variant:
    condition: "candidate responder can reach/fence every current command before promotion"
    model_result: "strict run exits 0 with invariants verified"
    invariants:
      - "SingleAuthority"
      - "NoForkedJournal"
      - "LocalIdempotency"
      - "SingleCommand"
  weak_variant:
    condition: "promotion without revoking unreachable prior authority"
    model_result: "SingleAuthority counterexample at depth 3; NoForkedJournal counterexample at depth 5"
    unsafe: true
  implementation_gaps:
    - "command_epoch not durably stored by services"
    - "stale epoch rejection not implemented"
    - "main evaluation harness skips promotion latency"

security:
  target_assumptions:
    - "organizational CA or identity provider"
    - "enrolled devices and users"
    - "Nginx terminates TLS/mTLS and passes certificate-derived identity"
    - "tablets authenticate to local K430 using enrolled certificates"
    - "WireGuard protects vehicle-to-core traffic"
  evaluated_emulation:
    - "plain HTTP on Docker bridge"
    - "Python stub supplies synthetic device and user identifiers"
  trust_boundaries:
    - label: "tablet to local K430"
      target: "HTTPS/mTLS over OPS-TABLET VLAN"
      evaluated: false
      sources:
        - "tablet/README.md:24-29"
        - "docs/architecture/network-topology.md:44-60"
    - label: "K430 to core"
      target: "WireGuard overlay plus HTTPS"
      evaluated: false
      sources:
        - "docs/architecture/network-topology.md:16-22"
        - "core/wireguard/README.md:3-9"
    - label: "K430 to K430"
      target: "Rajant transit-only mesh plus application HTTPS"
      evaluated: false
      sources:
        - "infra/rajant/README.md:7-17"
        - "docs/architecture/network-topology.md:24-30"
  limitations:
    - "offline revocation is delayed until nodes regain contact or receive updated trust bundles"
    - "compromised CA, Byzantine command behavior, physical tamper resistance, and fully compromised audit-log integrity are outside prototype evaluation"
  sources:
    - "paper/sections/05_implementation.tex:31"
    - "paper/sections/07_discussion.tex:9-13"
    - "docs/adr/0005-revocation-under-partition.md:7-21"

evaluation:
  environment:
    description: "Docker Compose emulation with one core, one command edge, three responder edges, shared Docker bridge, and Python stub."
    sources:
      - "paper/sections/06_evaluation.tex:8-19"
      - "scripts/evaluate-pilot.py:1-17"
    not_included:
      - "Rajant physical radio link"
      - "WireGuard overlay"
      - "mTLS termination"
      - "Android tablet path"
      - "physical router/mesh behavior"
  records:
    primary_records: 390
    skipped_promotion_records: 30
    raft_records: 160
    source: "paper/sections/06_evaluation.tex:21-28"
  missing_metadata:
    - "host CPU"
    - "host RAM"
    - "host OS"
    - "Docker version"
    - "TLS/VPN metadata"
  scenarios:
    - id: "bootstrap_latency"
      metric: "bootstrap_latency_ms"
      params:
        aoi_polygons:
          - 10
          - 50
          - 200
          - 1000
        runs_per_cell: 30
      results:
        - label: "AOI polygons = 10"
          median_ms: 7.24
          p95_ms: 9.79
        - label: "AOI polygons = 50"
          median_ms: 3.76
          p95_ms: 4.25
        - label: "AOI polygons = 200"
          median_ms: 2.83
          p95_ms: 4.28
        - label: "AOI polygons = 1000"
          median_ms: 9.88
          p95_ms: 19.24
      sources:
        - "scripts/evaluate-pilot.py:98-122"
        - "paper/tables/tab_evaluation.tex:3-7"
    - id: "field_edit_propagation"
      metric: "end_to_end_propagation_ms"
      measured_scope: "tablet stub HTTP submit to command-edge database commit"
      excluded_scope:
        - "Android local enqueue"
        - "tablet fan-out"
        - "core backhaul"
      params:
        queue_depth:
          - 1
          - 10
          - 100
        runs_per_cell: 30
      results:
        - label: "queue depth = 1"
          median_ms: 947.9
          p95_ms: 986.9
        - label: "queue depth = 10"
          median_ms: 946.3
          p95_ms: 1018.5
        - label: "queue depth = 100"
          median_ms: 1224.0
          p95_ms: 1314.6
      sources:
        - "scripts/evaluate-pilot.py:125-171"
        - "paper/tables/tab_evaluation.tex:9-12"
    - id: "wan_recovery"
      metric: "recovery_to_core_ms"
      measured_scope: "command-core WAN isolation and command-to-core catch-up"
      excluded_scope:
        - "responder isolation"
        - "crashes"
        - "restarts"
        - "physical radio behavior"
      params:
        partition_s:
          - 1
          - 10
          - 60
        events_per_run: 20
        runs_per_cell: 30
      results:
        - label: "partition = 1 s"
          median_ms: 2073
          p95_ms: 2227
        - label: "partition = 10 s"
          median_ms: 5793
          p95_ms: 5922
        - label: "partition = 60 s"
          median_ms: 706
          p95_ms: 2727
      sources:
        - "scripts/evaluate-pilot.py:174-225"
        - "scripts/inject-partition.sh:1-68"
        - "paper/tables/tab_evaluation.tex:14-17"
    - id: "command_throughput"
      metric: "events_per_sec"
      params:
        events_per_run: 1000
        included_runs: 29
        warmup_excluded: "run_index 0"
      results:
        - label: "events/s"
          median: 156.7
          p95: 160.4
      bottleneck: "FOR UPDATE lock around command-side sequence allocation"
      sources:
        - "scripts/evaluate-pilot.py:228-283"
        - "paper/tables/tab_evaluation.tex:19-20"
    - id: "duplicate_replay"
      metric: "stored_events"
      params:
        unique_events: 50
        replays_per_event: 5
        runs_per_cell: 30
      expected_result: "stored equals unique_events"
      sources:
        - "scripts/evaluate-pilot.py:286-330"
    - id: "command_promotion"
      metric: "command_promotion_latency_ms"
      status: "skipped in main harness"
      source: "scripts/evaluate-pilot.py:333-346"
  raft_baseline:
    cluster_size: 3
    sources:
      - "scripts/evaluate-raft-baseline.py:23-42"
      - "paper/tables/tab_baseline.tex:1-13"
    selected_results:
      - label: "Propagation, queue depth = 10, Rescue OIS"
        median_ms: 946.3
        p95_ms: 1018.5
      - label: "Propagation, queue depth = 10, Raft"
        median_ms: 10.5
        p95_ms: 18.1
      - label: "60 s recovery, Rescue OIS WAN to core"
        median_ms: 706
        p95_ms: 2727
      - label: "60 s recovery, Raft follower catch-up"
        median_ms: 4109
        p95_ms: 5109
      - label: "Raft quorum loss writes succeeded"
        n: 10
        success_percent: 0

formal_model:
  tla:
    file: "formal/tla/RescueOIS.tla"
    readme: "formal/tla/README.md"
    scope: "single incident journal, vehicle roles, authority set, local cursors, partition relation, strict vs weak promotion"
    constants:
      - "Vehicles"
      - "MaxJournal"
      - "ClientIds"
      - "StrictPromotion"
    variables:
      - "role"
      - "journal"
      - "cursor"
      - "authority"
      - "partition"
    actions:
      - "CommitEvent"
      - "PromoteWeak"
      - "PromoteStrict"
      - "PartitionPair"
      - "HealPair"
    invariants:
      - "SingleAuthority"
      - "NoForkedJournal"
      - "LocalIdempotency"
      - "SingleCommand"
    results:
