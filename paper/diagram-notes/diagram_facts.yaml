paper:
  title: "Offline-First Incident Information: A Tiered Sync Architecture for Rescue Service Operations over Intermittent Mesh Networks"
  main_tex: "paper/main.tex"
  title_source: "paper/main.tex:26"
  sections:
    - id: "abstract"
      title: "Abstract"
      file: "paper/sections/00_abstract.tex"
      line_start: 1
      line_end: 1
      key_claims:
        - "Authority-aware offline-first architecture composed of regional core, vehicle edge nodes, durable outboxes, append-only command-side journal, and bounded manual promotion."
        - "Evaluation is Docker Compose emulation; Rajant, WireGuard, mTLS, and Android tablet path are not exercised."
        - "Bounded TLA+ and Hypothesis tests validate single-writer and promotion invariants in an abstract model."
      hard_concepts:
        - "target deployment vs evaluated emulation"
        - "authority-bearing command journal"
        - "promotion requires fencing"
    - id: "sec:introduction"
      title: "Introduction"
      file: "paper/sections/01_introduction.tex"
      line_start: 1
      line_end: 21
      key_claims:
        - "Operational connectivity is intermittent, but tablet observations must remain durable."
        - "Requirements and constraints are derived from public sources and separated from design assumptions."
        - "Raft is contextual rather than workflow-equivalent."
      hard_concepts:
        - "requirements vs design choice"
        - "command-local progress"
        - "consensus comparison scope"
    - id: "sec:related"
      title: "Background and Related Work"
      file: "paper/sections/02_related_work.tex"
      line_start: 1
      line_end: 28
      key_claims:
        - "CoNICE preserves consensus semantics; this design encodes authority at the dispatched command vehicle."
        - "The incident journal writer is chosen by operational workflow rather than consensus."
        - "The contribution is the selection of consistency boundaries across state classes."
      hard_concepts:
        - "composed mechanisms"
        - "CRDT unsuitability for command decisions"
        - "mesh as intermittent transit"
    - id: "sec:architecture"
      title: "System Architecture"
      file: "paper/sections/03_system_architecture.tex"
      line_start: 1
      line_end: 133
      labels:
        - "sec:architecture"
        - "sec:requirements"
        - "tab:req-trace"
        - "sec:principles"
        - "sec:state-taxonomy"
        - "tab:state-taxonomy"
        - "fig:topology"
      key_claims:
        - "Operational setting has 2-10 vehicles, tablets, and a command vehicle fixed at dispatch."
        - "R1-R5 separate offline access, durable local capture, attributable command authority, constrained mesh, and existing identity integration."
        - "Tablets are leaf clients with no mesh participation or direct internet dependency."
      hard_concepts:
        - "three-tier deployment"
        - "command/responder role split"
        - "state taxonomy"
        - "target network segmentation vs emulation"
    - id: "sec:sync"
      title: "Synchronization Protocol"
      file: "paper/sections/04_synchronization_protocol.tex"
      line_start: 1
      line_end: 70
      labels:
        - "sec:sync"
        - "sec:protocol-contract"
        - "sec:promotion"
      key_claims:
        - "Responder field edits are durably enqueued before forwarding to command."
        - "Command accepts events idempotently by client_event_id, assigns event_seq, and appends the authoritative journal."
        - "Promotion safety requires fencing; durable epochs and stale-epoch rejection are not implemented in evaluated services."
      hard_concepts:
        - "local ACK vs command ACK"
        - "journal sequencing"
        - "partition behavior"
        - "strict promotion"
    - id: "sec:implementation"
      title: "Implementation"
      file: "paper/sections/05_implementation.tex"
      line_start: 1
      line_end: 31
      labels:
        - "sec:implementation"
        - "tab:implementation"
      key_claims:
        - "Evaluated prototype path includes sync-api, ops-api outbox, syncd responder/command, and command-core forwarder."
        - "mTLS, WireGuard, Rajant, Android tablet, promotion/fencing, and audit/provisioning are not end-to-end evaluated."
        - "Emulation uses plain HTTP on Docker bridge with synthetic device and user identifiers."
      hard_concepts:
        - "implemented vs scaffolded vs evaluated"
        - "target authentication controls"
        - "model-only promotion"
    - id: "sec:evaluation"
      title: "Evaluation"
      file: "paper/sections/06_evaluation.tex"
      line_start: 1
      line_end: 285
      labels:
        - "sec:evaluation"
        - "sec:validation"
        - "sec:eval-env"
        - "sec:eval-latency"
        - "tab:evaluation"
        - "fig:recovery"
        - "sec:eval-throughput"
        - "sec:eval-safety"
        - "sec:eval-baseline"
        - "tab:baseline"
        - "sec:eval-limits"
      key_claims:
        - "Evaluation uses Docker Compose with one core, one command edge, and three responders on a shared Docker bridge."
        - "Measured scenarios include bootstrap, field-edit propagation, WAN recovery, throughput, duplicate replay, and selected Raft comparison points."
        - "Physical mesh, WireGuard, mTLS, Android, crash injection, responder isolation, and restarts are outside reported measurements."
      hard_concepts:
        - "measurement scope"
        - "WAN recovery interpretation"
        - "formal model boundaries"
        - "Raft comparison scope"
    - id: "sec:discussion"
      title: "Discussion"
      file: "paper/sections/07_discussion.tex"
      line_start: 1
      line_end: 30
      key_claims:
        - "Single-writer sequencing applies only to authority-bearing incident-journal entries."
        - "Target security assumes organizational CA/IdP, enrolled devices/users, reverse-proxy identity propagation, and network segmentation."
        - "Offline revocation, stolen command nodes, compromised CA, Byzantine behavior, and audit integrity against compromised nodes are outside prototype evaluation."
      hard_concepts:
        - "trust boundaries"
        - "offline revocation"
        - "transferability limits"
    - id: "sec:conclusion"
      title: "Conclusion"
      file: "paper/sections/08_conclusion.tex"
      line_start: 1
      line_end: 5
      key_claims:
        - "The design preserves one command-side writer while allowing durable forward submission by responders."
        - "Strict promotion and fencing are required; automatic multi-writer failover is not provided."
      hard_concepts:
        - "trade-off summary"
        - "future work boundaries"

