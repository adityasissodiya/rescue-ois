\* Same weak protocol as RescueOIS_weak.cfg, but with the SingleAuthority
\* and SingleCommand role-level invariants suppressed so that BFS keeps
\* exploring past the depth-3 split-brain state and surfaces the deeper
\* NoForkedJournal violation -- the two-vehicles-commit-at-same-seq trace
\* described in safetyPlan.md.
INVARIANTS
